<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh1</title>
</head>
<body>
    <h1 id="sapa">Hallo!</h1>

    <script>
        const p = new URLSearchParams(location.search)
        const nama = p.get("nama") || "Andrea";

        document.querySelector("#sapa")
                .textContent = `Halo ${nama}!`;
    </script>
</body>
</html>
